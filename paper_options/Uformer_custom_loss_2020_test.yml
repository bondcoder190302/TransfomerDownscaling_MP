# Configuration for precipitation downscaling.
# Years: 2020 only (smoke-test / ablation run)
# Study region: India ([62.30, 1.30, 100.70, 39.70])
# Input : MSWEP precipitation at 0.1° (384x384)
#         ERA5 Land daily Wind speed/u/v at 0.1° (384x384)
# Target: CHIRPS daily precipitation at 0.05° (768x768)
# Auxiliary: Copernicus GLO-90 DEM elevation (768x768, static)
#            India Land-Sea Mask HR (768x768), LR (384x384), both static
# Scale factor: 2× (0.1° → 0.05°)
# Data split (2020): TRAIN=292, VAL=37, TEST=37
 
name: Uformer_2020_v2_asymloss
model_type: ClimateUformerMultiscaleFuseModel
scale: 2
num_gpu: 2
manual_seed: 0
fp16: false
 
anomaly_detection: false
finite_debug: false
freeze_layernorm: false
ln_freeze_iters: 0
 
# ── DATASETS ──────────────────────────────────────────────────────────────────
datasets:
  common:
    name: Precip
    type: MergeDataset
    dirName_stat: ./DownScale_Paper/param_stat/
    dirName_data: ./DownScale_Paper/
    listofVar: [MSWEP_precip_cut_log1p, ERA5_wind_speed_10m_cut, ERA5_u_wind_10m_cut, ERA5_v_wind_10m_cut]
    varName_gt: [CHIRPS_precip_cut_obs_log1p]
    index_gt: [0]
    radar_file: ./DownScale_Paper/DownScale_Correction_split/data.txt
    normalize: 'zscore'
    hgt_obs: 'HGT_fix_cut_obs'
    file_format: 'date'
    fix_file_name: 'HGT_fix.npy'
    lsm_lr_path: './DownScale_Paper/LSM_fix/india_lsm_LR.npy'
    lsm_hr_path: './DownScale_Paper/LSM_fix/india_lsm_HR.npy'
    p90_hr_path: './DownScale_Paper/percentile_maps/p90_hr_z.npy'
    p10_hr_path: './DownScale_Paper/percentile_maps/p10_hr_z.npy'
    seq_length: 1
    seq_interval: 1
 
  train:
    train_file: ./DownScale_Paper/DownScale_Correction_split/train_12_36.txt
    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 4
    randomcrop: true
    gt_size: 128
    prefetch_mode: ~
 
  # val:
  #   seq_interval: 1
  #   train_file: ./DownScale_Paper/DownScale_Correction_split/val_12_36.txt
  test:
   seq_interval: 1
   train_file: ./DownScale_Paper/DownScale_Correction_split/test_12_36.txt

# network structures
network_g:
  type: ClimateUformerMultiScaleHGTMultiScaleOut
  add_hgt: true
  upscale: 2
  num_in_ch: 4 # MSWEP precipitation + ERA5 10 m wind speed/u/v
  num_out_ch: 1 # CHIRPS precipitation (1 channel)
  img_size: 64 # LR input spatial size (gt_size / scale = 128 / 2)
  window_size: 16
  depths: [2, 2, 2, 2, 2]
  embed_dim: 128
  num_heads: [4, 8, 16, 16, 8]
  mlp_ratio: 4
  token_projection: 'linear'
  token_mlp: 'leff'
  activation: none
  multi_add_pos: 'xcoder'
  drop_path_rate: 0.0

# ── PATH CONFIGURATIONS & RUNTIME MODES ───────────────────────────────────────
path:
  # ────────────────────────────────────────────────────────────────────────────
  # MODE A: Fresh Training Start  ← ACTIVE for this smoke test
  #   - pretrain_network_g: ~
  #   - resume_state: ~
  #
  # MODE B: Resuming an Interrupted Run (Stage 1 to Stage 2 Chaining)
  #   - pretrain_network_g: ~
  #   - resume_state: [path to your saved .state file, e.g., 730.state]
  #
  # MODE C: Testing / Inference Mode (Using a fully trained model)
  #   - pretrain_network_g: [path to your best weights file, e.g., net_g_latest.pth]
  #   - resume_state: ~
  # ────────────────────────────────────────────────────────────────────────────

  pretrain_network_g: ./experiments/Uformer_2020_v2_asymloss/models/net_g_latest.pth
  strict_load_g: true
  resume_state: ~ #./experiments/Uformer_2020_v2_asymloss/training_states/13155.state

# ── TRAINING ──────────────────────────────────────────────────────────────────
train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    betas: [0.9, 0.95]
    eps: !!float 1e-6
 
  scheduler:
    type: MultiStepLR
    # Drop LR at 50%, 75%, 85%, 95% of total iterations
    milestones: [730, 1095, 1241, 1387]
    gamma: 0.5
 
  total_iter: 1460   # ~5 epochs on 2020 data
  warmup_iter: -1
 
  # ── PRIMARY PIXEL LOSS ──────────────────────────────────────────────────────
  #
  # Threshold values (all in log1p + z-score space):
  #   CHIRPS stats: mean=0.4180, std=0.9470
  #
  #   extreme_threshold = 3.1916
  #     → wet-day P90 computed from 2192 days × India land pixels
  #     → physical value ≈ 30.2 mm/day (heavy monsoon rain)
  #     → formula: (log1p(30.2) - 0.4180) / 0.9470
  #
  #   wet_threshold = -0.4414
  #     → z-score of exactly 0 mm/day
  #     → formula: (log1p(0.0) - 0.4180) / 0.9470
  #     → ocean pixels are forced to z=0.0 by LSM; real dry land pixels sit
  #       at z=-0.4414; so this boundary is at the true dry-day edge.
  #
  #   low_threshold = -0.4414, low_weight = 1.0
  #     → DISABLED (code skips this branch when low_weight == 1.0)
  #     → kept for documentation; remove or set low_weight > 1.0 to enable
  #
  # under_weight = 1.5
  #   → Multiplies the Charbonnier weight by 1.5 when pred < target.
  #   → Addresses the confirmed dry bias (log-space: -0.18, heavy-day: -20 mm).
  #   → Effect: extreme under-predicted pixel gets weight = extreme_weight * under_weight = 2.25×
  #   → If validation bias flips positive (wet bias), reduce to 1.2–1.3.
  #
  # wet_weight = 0.5
  #   → Enables the soft BCE occurrence term (wet/dry spatial accuracy).
  #   → If training loss becomes unstable (NaN / large spikes), reduce to 0.2.
  #
  pixel_opt:
    type: MaskedExtremeWeightedCharbonnierLoss
    loss_weight: 10
    reduction: sum
    eps: !!float 1e-3
    extreme_weight: 1.5      # Chandel r2 (applied where target > local P90)
    under_weight: 1.5        # asymmetric dry-bias penalty (kept from v2)
    low_weight: 1.0          # Chandel r1; 1.0 = lower tail off (start here)
    wet_weight: 0.5
    wet_threshold: -0.4414
    wet_scale: 0.3
    # extreme_threshold / low_threshold unused when p90/p10 maps are provided              # sigmoid temperature: sharp but smooth boundary
 
  # ── MULTISCALE AUXILIARY LOSS ──────────────────────────────────────────────
  # Supervises the 3 intermediate decoder outputs (out0, out1, out2).
  # Identical type/params but half the loss_weight of the primary loss.
  pixel_multiscale_opt:
    type: MaskedExtremeWeightedCharbonnierLoss
    loss_weight: 5
    reduction: sum
    eps: !!float 1e-3
    extreme_weight: 1.5
    under_weight: 1.5
    low_weight: 1.0
    wet_weight: 0.5
    wet_threshold: -0.4414
    wet_scale: 0.3
 
  # ── SSIM LOSS ─────────────────────────────────────────────────────────────
  ssim_opt: ~   # disabled; enable only after verifying loss stability above
    # type: ClimateSSIMLoss
    # loss_weight: 1
    # data_range: 6.5211 
# ── VALIDATION ────────────────────────────────────────────────────────────────
val:
  val_freq: 146   # validate once per epoch
  save_img: false
  save_npy: true
  save_npy_onlyoutput: true
  pbar: true
 
  metrics:
    psnr:
      type: calculate_climate_psnr
      data_range: 6.5211
      crop_border: 0
      better: higher
    ssim:
      type: calculate_climate_ssim
      data_range: 6.5211
      crop_border: 0
      better: higher
    mse:
      type: calculate_climate_mse
      crop_border: 0
      better: lower
    mae:
      type: calculate_climate_mae
      crop_border: 0
      better: lower
 
# ── LOGGING ───────────────────────────────────────────────────────────────────
logger:
  print_freq: 20
  save_checkpoint_freq: 146
  use_tb_logger: false
 
# ── DISTRIBUTED TRAINING ──────────────────────────────────────────────────────
dist_params:
  backend: nccl
  port: 29500