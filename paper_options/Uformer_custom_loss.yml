# Configuration for precipitation downscaling.
# Years: six, 2015 to 2020, total days: 2192 (leap years 2016 and 2020)
# Study region: India ([62.2998717527286487, 1.3000558348497222, 100.6998717527286544, 39.7000558348497279])
# Input : MSWEP precipitation at 0.1° (384x384)
#         ERA5 Land daily Wind at 0.1° (384x384)
# Target: CHIRPS daily precipitation at 0.05° (768x768)
# Auxiliary: Copernicus GLO-90 DEM elevation (768x768, static),
#            India Land sea mask HR (768x768, static),
#            India Land sea mask LR (384x384, static)
# Scale factor: 2× (0.1° → 0.05°)
# Data split (6 year): TRAIN=1754, VAL=219, TEST=219

name: Uformer_2015_2020_Multivar_LSM_ep120_2e4lr_c128
model_type: ClimateUformerMultiscaleFuseModel
scale: 2
num_gpu: 2 # set num_gpu: 0 for cpu mode
manual_seed: 0
fp16: false

# Debug / stability flags (all off by default; set true only for debugging)
anomaly_detection: false
finite_debug: false
freeze_layernorm: false

# LayerNorm affine warmup freeze: freeze LN affine params for the first N iterations
# then automatically unfreeze them. Real-iteration units.
ln_freeze_iters: 0 #10

# dataset and data loader settings
datasets:
  common:
    name: Precip
    type: MergeDataset
    dirName_stat: ./DownScale_Paper/param_stat/
    dirName_data: ./DownScale_Paper/
    # Inputs: MSWEP precipitation (log1p) + ERA5 10 m wind speed/u/v (raw, no log1p)
    listofVar: [MSWEP_precip_cut_log1p, ERA5_wind_speed_10m_cut, ERA5_u_wind_10m_cut, ERA5_v_wind_10m_cut]
    # CHIRPS precipitation is the super-resolution target (1 channel)
    varName_gt: [CHIRPS_precip_cut_obs_log1p]
    # Maps model output channel 0 → listofVar[0] for bicubic baseline comparison
    index_gt: [0]
    radar_file: ./DownScale_Paper/DownScale_Correction_split/data.txt
    normalize: 'zscore'
    # Copernicus DEM elevation used as auxiliary static input
    hgt_obs: 'HGT_fix_cut_obs'
    # 'date' format: each .npy file is named YYYYMMDD.npy (no area/lead-hour suffix)
    file_format: 'date'
    # Name of the single static elevation file inside HGT_fix_cut_obs/
    fix_file_name: 'HGT_fix.npy'
    lsm_lr_path: './DownScale_Paper/LSM_fix/india_lsm_LR.npy'
    lsm_hr_path: './DownScale_Paper/LSM_fix/india_lsm_HR.npy'
    seq_length: 1
    seq_interval: 1
  train:
    train_file: ./DownScale_Paper/DownScale_Correction_split/train_12_36.txt # 292 samples (2020)
    # dataloader
    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 4
    randomcrop: true
    # HR image size (128 px at 0.05°); LQ crop = gt_size / scale = 64
    gt_size: 128
    prefetch_mode: ~

  # val:
  #   seq_interval: 1
  #   train_file: ./DownScale_Paper/DownScale_Correction_split/val_12_36.txt

  test:
   seq_interval: 1
   train_file: ./DownScale_Paper/DownScale_Correction_split/test_12_36.txt

# network structures
network_g:
  type: ClimateUformerMultiScaleHGTMultiScaleOut
  add_hgt: true
  upscale: 2
  num_in_ch: 4 # MSWEP precipitation + ERA5 10 m wind speed/u/v
  num_out_ch: 1 # CHIRPS precipitation (1 channel)
  img_size: 64 # LR input spatial size (gt_size / scale = 128 / 2)
  window_size: 16
  depths: [2, 2, 2, 2, 2]
  embed_dim: 128
  num_heads: [4, 8, 16, 16, 8]
  mlp_ratio: 4
  token_projection: 'linear'
  token_mlp: 'leff'
  activation: none
  multi_add_pos: 'xcoder'
  drop_path_rate: 0.0

# ── PATH CONFIGURATIONS & RUNTIME MODES ───────────────────────────────────────
path:
  # ────────────────────────────────────────────────────────────────────────────
  # MODE A: Fresh Training Start  ← ACTIVE for this smoke test
  #   - pretrain_network_g: ~
  #   - resume_state: ~
  #
  # MODE B: Resuming an Interrupted Run (Stage 1 to Stage 2 Chaining)
  #   - pretrain_network_g: ~
  #   - resume_state: [path to your saved .state file, e.g., 730.state]
  #
  # MODE C: Testing / Inference Mode (Using a fully trained model)
  #   - pretrain_network_g: [path to your best weights file, e.g., net_g_latest.pth]
  #   - resume_state: ~
  # ────────────────────────────────────────────────────────────────────────────

  pretrain_network_g: ./experiments/Uformer_2015_2020_Multivar_LSM_ep120_2e4lr_c128/models/net_g_latest.pth
  strict_load_g: true
  resume_state: ~ #./experiments/Uformer_2015_2020_Multivar_LSM_ep120_2e4lr_c128/training_states/13155.state

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    betas: [0.9, 0.95]
    eps: !!float 1e-6 #can be removed but it prevents division by zero and reduces instability when gradients are tiny or noisy.

  scheduler:
    type: MultiStepLR
    # REAL iterations: Drop LR at 50%, 75%, 85%, and 95% of your total iterations
    milestones: [13155, 19732, 22363, 24994]
    gamma: 0.5 #decay LR by half at each milestone

  total_iter: 26310 #13155
  warmup_iter: -1 #10

  # ── PRIMARY PIXEL LOSS ────────────────────────────────────────────────────
  # FIXED from original:
  #   1. Weight formula: weight = 1 + (extreme_weight-1) * excess / extreme_threshold
  #      → at exactly the threshold the multiplier equals extreme_weight (5.0x here).
  #      Old formula 1 + extreme_weight * excess reached 14.87x at the same point,
  #      making gradients ~3x more aggressive than intended.
  #   2. Ocean pixel epsilon leak: auto-detection via (target != 0.0) now excludes
  #      ocean pixels from the Charbonnier sum even when mask is not passed explicitly.
  #   3. wet_weight: 0.0 means the BCE occurrence term is OFF (stable default).
  #      Set wet_weight: 0.5 and compute your wet_threshold to enable it:
  #        python -c "import pickle,math; s=pickle.load(open('...CHIRPS_precip_obs_log1p_stat.pkl','rb')); print((0-s['mean'].item())/math.sqrt(s['var'].item()))"
  pixel_opt:
    type: MaskedExtremeWeightedCharbonnierLoss
    loss_weight: 10
    reduction: sum            # norm_factor division is applied in optimize_parameters
    eps: !!float 1e-3
    extreme_threshold: 2.773  # >20 mm/day in CHIRPS log-z-score space
    extreme_weight: 5.0       # at exactly the threshold, multiplier = 5.0x (not ~15x)
    wet_weight: 0.0           # 0.0 = disabled; set 0.5 to add occurrence BCE term
    wet_threshold: -0.9       # z-score of log1p(0) for CHIRPS (compute from stat pkl)
    wet_scale: 0.3            # sigmoid temperature for soft wet-day boundary

  # ── MULTISCALE AUXILIARY LOSS ─────────────────────────────────────────────
  # FIX: ClimateUformerMultiScaleHGTMultiScaleOut returns 4 outputs:
  #   output[0] = fused final output  (supervised by pixel_opt above)
  #   output[1..3] = out0, out1, out2 (intermediate decoder scales)
  # Without pixel_multiscale_opt these three intermediate outputs get NO direct
  # gradient signal (only indirect signal through conv_fuse). Adding this
  # ensures all four outputs are explicitly supervised.
  # Use identical loss type/params but a separate instance with lower loss_weight.
  pixel_multiscale_opt:
    type: MaskedExtremeWeightedCharbonnierLoss
    loss_weight: 5            # half the primary loss weight for auxiliary outputs
    reduction: sum
    eps: !!float 1e-3
    extreme_threshold: 2.773
    extreme_weight: 5.0
    wet_weight: 0.0
    wet_threshold: -0.9
    wet_scale: 0.3

  # ── OPTIONAL SSIM LOSS ────────────────────────────────────────────────────
  ssim_opt: ~  # Keep null to disable. Enable for spatial-structure supervision:
  # ssim_opt:
  #   type: ClimateSSIMLoss
  #   loss_weight: 1
  #   data_range: 6.5211

# validation settings
val:
  val_freq: 877
  save_img: false
  save_npy: true
  save_npy_onlyoutput: true
  pbar: true

  metrics:
    psnr:
      type: calculate_climate_psnr
      data_range: 6.5211
      crop_border: 0
      better: higher
    ssim:
      type: calculate_climate_ssim
      data_range: 6.5211
      crop_border: 0
      better: higher
    mse:
      type: calculate_climate_mse
      crop_border: 0
      better: lower
    mae:
      type: calculate_climate_mae
      crop_border: 0
      better: lower

# logging settings
logger:
  print_freq: 20
  save_checkpoint_freq: 877
  use_tb_logger: false

# dist training settings
dist_params:
  backend: nccl
  port: 29500